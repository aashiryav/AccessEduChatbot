<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessEDU - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body, html {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background-color: #f3f4f8;
    height: 100%;
}

.site-header {
    background-color: #23406e;
    position: relative;
    padding: 12px 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 32px;
}
.language-bar {
    background: rgba(255,255,255,0.7);
    border-radius: 12px;
    padding: 8px 24px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px #23406e22;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 24px;
    font-size: 1.3rem;
    font-family: 'Inter', Arial, sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    border-bottom: none;
    position: relative;
    top: auto;
    right: auto;
    z-index: 2;
    width: auto;
    min-width: 0;
    max-width: none;
}
.language-link {
    color: #23406e;
    text-decoration: none;
    cursor: pointer;
    padding: 8px 18px;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
}
.language-link.selected, .language-link:hover {
    background: #23406e;
    color: #fff;
}

/* Navigation Bar */
.nav {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    z-index: 2;
    box-sizing: border-box;
    margin-top: 0;
    align-self: stretch;
}
.nav-left { display: flex; align-items: center; gap: 36px; }
.logo-text {
    font-family: 'Montserrat', 'Inclusive Sans', 'Segoe UI', Arial, sans-serif;
    font-weight: 900;
    font-size: 2rem;
    color: #fff;
    letter-spacing: 1px;
    line-height: 1;
}
.logo {
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(255, 255, 255, 0.5);
    padding: 10px;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.2s;
}
.logo:hover {
    background: rgba(255, 255, 255, 0.7);
}
.logo-img {
    width: 64px;
    height: 64px;
    object-fit: contain;
}
.nav-links {
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.4);
    border-radius: 12px;
    padding: 8px 18px;
}
.nav-link {
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    font-size: 1.25rem;
    letter-spacing: 0.5px;
    background: transparent;
    border-radius: 8px;
    padding: 8px 18px;
    transition: background 0.2s, color 0.2s;
    box-shadow: none;
    display: inline-block;
}
.nav-link:hover, .nav-link:focus {
    background: #fff;
    color: #23406e;
}
.nav-right { display: flex; align-items: center; gap: 24px; }
.login-link { color: #fff; font-weight: 700; text-decoration: none; font-size: 1.3rem; }
.cta-btn { background: #23406e; color: #fff; border-radius: 32px; padding: 10px 24px; text-decoration: none; font-weight: 700; font-size: 1.3rem; }

/* Signup Page Specifics */
.signup-content {
    max-width: 400px;
    margin: 48px auto 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.signup-content h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 2.2rem;
    color: #23406e;
    margin-bottom: 32px;
    text-align: center;
}
.signup-content form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 24px;
}
.input-group label {
    font-weight: 700;
    color: #23406e;
    margin-bottom: 6px;
}
.input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #bfc4d1;
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    box-sizing: border-box;
}
.signup-btn {
    width: 100%;
    background: #23406e;
    color: #fff;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background 0.2s;
}
.signup-btn:hover {
    background: #1a2e4d;
}
.social-separator {
    color: #bfc4d1;
    font-weight: 600;
    margin: 18px 0 10px 0;
    text-align: center;
    width: 100%;
}
.social-login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 12px;
    border: 1px solid #bfc4d1;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    margin-bottom: 10px;
    font-size: 1.08rem;
    font-weight: 600;
    transition: box-shadow 0.2s;
    box-shadow: 0 1px 4px #b0c4de22;
    gap: 12px;
}
.social-login-btn img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    vertical-align: middle;
    box-shadow: 0 1px 4px #b0c4de22;
}
.login-prompt {
    text-align: center;
    margin-top: 24px;
    color: #23406e;
    font-size: 1.08rem;
}
.login-prompt a {
    color: #23406e;
    font-weight: 700;
    text-decoration: none;
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="language-bar" id="languageBar">
            <span class="language-link selected" data-lang="en">EN</span>
            <span class="language-link" data-lang="es">ES</span>
            <span class="language-link" data-lang="fr">FR</span>
            <span class="language-link" data-lang="zh-Hans">中文</span>
            <span class="language-link" data-lang="ar">العربية</span>
            <span class="language-link" data-lang="hi">हिन्दी</span>
            <span class="language-link" data-lang="vi">Tiếng Việt</span>
            <span class="language-link" data-lang="ko">한국어</span>
            <span class="language-link" data-lang="fil">Filipino</span>
            <span class="language-link" data-lang="bn">বাংলা</span>
            <span class="language-link" data-lang="ur">اردو</span>
        </div>
        <div class="nav">
            <div class="nav-left">
                <a href="/" class="logo">
                    <img src="/static/images/a3e929fd-63d2-4f73-abba-98a2528d3efb-removebg-preview.png" alt="AccessEDU Logo" class="logo-img">
                    <span class="logo-text">AccessEDU</span>
                </a>
                <div class="nav-links">
                    <a href="{{ url_for('chatbot') }}" class="nav-link">FAFSA Help</a>
                    <a href="{{ url_for('scholarship_finder') }}" class="nav-link">Scholarships</a>
                    <a href="{{ url_for('budget_scanner') }}" class="nav-link">Budget Planner</a>
                    <a href="{{ url_for('learner') }}" class="nav-link">Learner</a>
                </div>
            </div>
            <div class="nav-right">
                <a href="{{ url_for('login') }}" class="login-link">Log In</a>
                <a href="{{ url_for('signup') }}" class="cta-btn">Sign Up</a>
            </div>
        </div>
    </header>
    <div class="signup-content">
        <h1>Create your account</h1>
        <form action="{{ url_for('home') }}">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
        <div class="social-separator">OR</div>
        <button type="button" class="social-login-btn">
            <img src="/images/microsoft.png" alt="Microsoft"> Continue with Microsoft
        </button>
        <button type="button" class="social-login-btn">
            <img src="/images/google.png" alt="Google"> Continue with Google
        </button>
        <button type="button" class="social-login-btn">
            <img src="/images/apple.png" alt="Apple"> Continue with Apple
        </button>
        <div class="login-prompt">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </div>
    </div>
</body>
</html>
