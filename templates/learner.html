<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Aid 101: Your College Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background-color: #F0F2F6;
            color: #333333;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header and Navigation Styles */
        .site-header {
            background-color: #23406e;
            position: relative;
            padding: 12px 24px;
        }

        .language-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 0 10px 0;
            gap: 15px;
        }

        .language-link {
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            font-size: 0.9rem;
        }

        .language-link.selected, .language-link:hover {
            background: #fff;
            color: #23406e;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 36px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 48px;
            height: 48px;
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* Page Body Layout */
        .page-body {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 300px;
            background-color: #FFFFFF;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-family: 'Montserrat', sans-serif;
            color: #0052A0;
            font-size: 1.4rem;
            margin-top: 0;
        }

        .module-nav-item {
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 700;
            color: #333;
            border: 1px solid transparent;
        }

        .module-nav-item:hover {
            background-color: #E7F3FF;
        }

        .module-nav-item.active {
            background-color: #0068C9;
            color: white;
            border-color: #0052A0;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 5px;
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background-color: #4caf50;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Flashcard Styling */
        .flashcard {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #D0D0D0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .flashcard:hover {
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 1px solid #0068C9;
        }

        .flashcard h3 {
            color: #0068C9;
            font-size: 2rem;
            font-family: 'Montserrat', sans-serif;
            margin-top: 0;
        }

        /* Info Box Styling */
        .info-box {
            background-color: #f0f0f0;
            color: #222;
            border-radius: 10px;
            padding: 18px 20px;
            margin: 20px 0;
            font-size: 1rem;
            border-left: 5px solid #0068C9;
        }

        .info-box h4 { margin-top: 0; }

        /* Quiz Styling */
        .quiz-container { margin-top: 25px; }

        .quiz-option {
            background-color: #FFFFFF;
            border: 1px solid #D0D0D0;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .quiz-option:hover {
            background-color: #E7F3FF;
            border-color: #0068C9;
        }

        /* Feedback Styling */
        .quiz-feedback {
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-weight: 500;
        }

        .quiz-feedback-correct {
            background-color: #E7F3FF;
            color: #0052A0;
            border: 1px solid #B3D7FF;
        }

        .quiz-feedback-incorrect {
            background-color: #FFD2D2;
            color: #D8000C;
            border: 1px solid #FFBABA;
        }

        /* Button Styling */
        .styled-button {
            border-radius: 20px;
            border: 1px solid #0068C9;
            background-color: #0068C9;
            color: white;
            padding: 12px 28px;
            transition: 0.3s;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            display: inline-block;
            margin-top: 15px;
        }

        .styled-button:hover {
            background-color: #0052A0;
            border: 1px solid #0052A0;
        }

        /* Badge Styling */
        #badges-container {
            margin-top: 20px;
        }
        .badge {
            background-color: #E7F3FF;
            color: #0068C9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #B3D7FF;
        }
        .badge h4 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #0052A0;
        }
        .badge p {
            margin: 0;
            font-size: 0.9rem;
            color: #333333;
        }

    </style>
</head>
<body>
    <header class="site-header">
        <div class="language-bar" id="languageBar">
            <!-- Language links can be populated here -->
        </div>
        <div class="nav">
            <div class="nav-left">
                <a href="#" class="logo">
                    <!-- Using a placeholder for the image path -->
                    <img src="https://placehold.co/48x48/ffffff/23406e?text=Logo" alt="AccessEDU Logo" class="logo-img">
                    <span class="logo-text">AccessEDU</span>
                </a>
                <div class="nav-links">
                    <a href="#" class="nav-link">FAFSA Help</a>
                    <a href="#" class="nav-link">Scholarships</a>
                    <a href="#" class="nav-link">Budget Planner</a>
                    <a href="#" class="nav-link active">Learner</a>
                </div>
            </div>
            <div class="nav-right">
                 <!-- Login/Signup buttons can go here -->
            </div>
        </div>
    </header>

    <div class="page-body">
        <div class="sidebar" id="sidebar">
            <h2>Learning Modules</h2>
            <div id="module-navigation"></div>
            <hr>
            <h2>My Badges</h2>
            <div id="badges-container">
                <p>Complete modules to earn badges!</p>
            </div>
        </div>
        <div class="main-content" id="main-content">
            <!-- Content will be dynamically loaded here by JavaScript -->
        </div>
    </div>

    <script>
    // --- Global Data Variables ---
    let VOCAB = {};
    let BADGES = [];

    // --- Application State ---
    let state = {
        currentModule: null,
        cardIndices: {},
        moduleProgress: {},
        badges: new Set()
    };

    // --- DOM Elements ---
    const mainContent = document.getElementById('main-content');
    const moduleNavContainer = document.getElementById('module-navigation');
    const badgesContainer = document.getElementById('badges-container');

    // --- Data Fetching ---
    async function fetchLearnerData() {
        try {
            // This URL should point to your running Flask server's API endpoint
            const response = await fetch('http://127.0.0.1:5000/api/learner-data');
            if (!response.ok) {
                // Handle HTTP errors like 404 or 500
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            VOCAB = data.vocab;
            BADGES = data.badges;
            initializeState();
            render();
        } catch (error) {
            mainContent.innerHTML = `<div class="flashcard"><h3>Error</h3><p>Could not load learning content. Please make sure the Flask backend server is running and try refreshing the page.</p></div>`;
            console.error("Failed to fetch learner data:", error);
        }
    }

    // --- Initialization ---
    function initializeState() {
        const moduleNames = Object.keys(VOCAB);
        state.currentModule = moduleNames[0] || null;
        moduleNames.forEach(name => {
            state.cardIndices[name] = 0;
            state.moduleProgress[name] = 0;
        });
    }

    // --- Rendering Functions ---
    function renderSidebar() {
        moduleNavContainer.innerHTML = '';
        Object.keys(VOCAB).forEach(moduleName => {
            const moduleData = VOCAB[moduleName];
            if (!moduleData) return;
            const progress = moduleData.length > 0 ? (state.moduleProgress[moduleName] / moduleData.length) * 100 : 0;
            const navItem = document.createElement('div');
            navItem.className = 'module-nav-item';
            if (moduleName === state.currentModule) {
                navItem.classList.add('active');
            }
            navItem.innerHTML = `
                ${moduleName}
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: ${progress}%;"></div>
                </div>
            `;
            navItem.addEventListener('click', () => {
                state.currentModule = moduleName;
                render();
            });
            moduleNavContainer.appendChild(navItem);
        });
    }

    function renderBadges() {
        const earnedBadges = BADGES.filter(b => state.badges.has(b.name));
        if (earnedBadges.length > 0) {
            badgesContainer.innerHTML = '';
            earnedBadges.forEach(badge => {
                badgesContainer.innerHTML += `
                    <div class="badge">
                        <h4>${badge.icon} ${badge.name}</h4>
                        <p>${badge.desc}</p>
                    </div>
                `;
            });
        } else {
             badgesContainer.innerHTML = `<p>Complete modules to earn badges!</p>`;
        }
    }

    function renderCard() {
        const moduleName = state.currentModule;
        if (!moduleName) {
            mainContent.innerHTML = `<div class="flashcard"><h3>Welcome!</h3><p>Select a module from the left to get started.</p></div>`;
            return;
        }
        const cardIndex = state.cardIndices[moduleName];
        const moduleData = VOCAB[moduleName];

        if (!moduleData || moduleData.length === 0) {
             mainContent.innerHTML = `<div class="flashcard"><h3>Coming Soon!</h3><p>Content for the "${moduleName}" module is being prepared.</p></div>`;
             return;
        }

        if (cardIndex >= moduleData.length) {
            mainContent.innerHTML = `
                <div class="flashcard">
                    <h3>🎉 Module Complete!</h3>
                    <p>You've mastered all the concepts in "${moduleName}". Select another module to continue learning.</p>
                </div>
            `;
            return;
        }

        const card = moduleData[cardIndex];
        mainContent.innerHTML = `
            <div class="flashcard">
                <h3>${card.term}</h3>
                <div class="info-box">
                    <h4>Definition</h4>
                    <p>${card.definition}</p>
                </div>
                <div class="info-box">
                    <h4>Example</h4>
                    <p>${card.example}</p>
                </div>
                <div class="quiz-container" id="quiz-container"></div>
            </div>
        `;
        renderQuiz(card.quiz[0]);
    }
    
    function renderQuiz(quizData) {
        const quizContainer = document.getElementById('quiz-container');
        if (!quizData) return;
        quizContainer.innerHTML = `<h4>Check Your Knowledge</h4><p>${quizData.q}</p>`;
        
        const optionsContainer = document.createElement('div');
        quizData.options.forEach((option, index) => {
            const optionEl = document.createElement('div');
            optionEl.className = 'quiz-option';
            optionEl.textContent = option;
            optionEl.addEventListener('click', () => handleQuizAnswer(index, quizData));
            optionsContainer.appendChild(optionEl);
        });
        
        quizContainer.appendChild(optionsContainer);
        quizContainer.innerHTML += `<div id="feedback-container"></div>`;
    }

    function handleQuizAnswer(selectedIndex, quizData) {
        const feedbackContainer = document.getElementById('feedback-container');
        const isCorrect = selectedIndex === quizData.correct;
        
        let feedbackClass = isCorrect ? 'quiz-feedback-correct' : 'quiz-feedback-incorrect';
        let feedbackTitle = isCorrect ? 'Correct!' : 'Not Quite!';

        feedbackContainer.innerHTML = `
            <div class="quiz-feedback ${feedbackClass}">
                <strong>${feedbackTitle}</strong>
                <p>${quizData.explanation}</p>
            </div>
        `;

        if (isCorrect) {
            feedbackContainer.innerHTML += `<button class="styled-button" id="next-btn">Next Concept &rarr;</button>`;
            document.getElementById('next-btn').addEventListener('click', advanceCard);
            // Lock out other options
            document.querySelectorAll('.quiz-option').forEach((el, index) => {
                el.style.pointerEvents = 'none';
                if (index === selectedIndex) {
                    el.style.backgroundColor = '#E7F3FF';
                    el.style.borderColor = '#0068C9';
                }
            });
        }
    }

    // --- Logic Functions ---
    function advanceCard() {
        const moduleName = state.currentModule;
        // Only increment progress if it's a new card being completed
        if (state.cardIndices[moduleName] === state.moduleProgress[moduleName]) {
             state.moduleProgress[moduleName]++;
        }
        state.cardIndices[moduleName]++;
        
        checkAndAwardBadges();
        render();
    }
    
    function checkAndAwardBadges() {
        const totalProgress = Object.values(state.moduleProgress).some(p => p > 0);
        if (totalProgress) { state.badges.add("Aid Apprentice"); }

        const fafsaModule = VOCAB["📄 The FAFSA Deep Dive"];
        if (fafsaModule && fafsaModule.length > 0 && state.moduleProgress["📄 The FAFSA Deep Dive"] >= fafsaModule.length) {
            state.badges.add("FAFSA Filer");
        }
        
        const allModulesCompleted = Object.keys(VOCAB).every(m => {
            const moduleData = VOCAB[m];
            return !moduleData || moduleData.length === 0 || state.moduleProgress[m] >= moduleData.length;
        });
        if (allModulesCompleted) {
            state.badges.add("Knowledge Knight");
            state.badges.add("Financial Aid Guru");
        }
    }

    // --- Main Render Function ---
    function render() {
        renderSidebar();
        renderCard();
        renderBadges();
    }

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
        fetchLearnerData();
    });

    </script>
</body>
</html>
